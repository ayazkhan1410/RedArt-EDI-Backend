# Render Blueprint — RedArt EDI TEST API
# https://render.com/docs/blueprint-spec
#
# Lovable hosts UI only. This Blueprint deploys the Django EDI API + Postgres + Redis.
# After deploy: set EDI_PUBLIC_BASE_URL, create service user, share handoff securely.
# See docs/LOVABLE_EDI_DEPLOY.md

databases:
  - name: edi-postgres
    plan: free
    databaseName: edi
    user: edi

services:
  - type: redis
    name: edi-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: redart-edi-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: web
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: redartdigital.settings.production
      - key: USE_GUNICORN
        value: "true"
      - key: RUN_MIGRATE_ON_START
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: API_REQUIRE_AUTH
        value: "true"
      - key: EDI_ALLOW_LOVABLE_ORIGINS
        value: "true"
      - key: POSTGRES_HOST
        fromDatabase:
          name: edi-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: edi-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: edi-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: edi-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: edi-postgres
          property: password
      - key: POSTGRES_SSLMODE
        value: require
      - key: CELERY_BROKER_URL
        fromService:
          name: edi-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: edi-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: EDI_PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EDI_API_SERVICE_USERNAME
        value: redart_api
      - key: EDI_API_SERVICE_PASSWORD
        sync: false

  - type: worker
    name: redart-edi-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: worker
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: redartdigital.settings.production
      - key: POSTGRES_HOST
        fromDatabase:
          name: edi-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: edi-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: edi-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: edi-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: edi-postgres
          property: password
      - key: POSTGRES_SSLMODE
        value: require
      - key: CELERY_BROKER_URL
        fromService:
          name: edi-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: edi-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          name: redart-edi-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
