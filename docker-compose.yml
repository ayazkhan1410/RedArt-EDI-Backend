# ========
# RedArt EDI — Docker Compose
# One command: docker compose up --build
# Daily use (no pip reinstall): docker compose up -d
# ========

x-app-image: &app_image
  image: redart-edi:local
  build:
    context: .
    dockerfile: Dockerfile

services:

  # ========
  # PostgreSQL
  # ========
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edi}
      POSTGRES_USER: ${POSTGRES_USER:-edi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 7001 → container 5432 (avoids clash with local Postgres on 5432)
      - "${POSTGRES_HOST_PORT:-7001}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edi} -d ${POSTGRES_DB:-edi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========
  # Redis (Celery broker / results)
  # ========
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      # Host 7002 → container 6379
      - "${REDIS_HOST_PORT:-7002}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========
  # Django backend
  # ========
  backend:
    <<: *app_image
    container_name: backend
    restart: unless-stopped
    command: web
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: redartdigital.settings.docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      USE_GUNICORN: "false"
      RUN_MIGRATE_ON_START: "true"
      AUTO_RELOAD: "true"
      API_REQUIRE_AUTH: "${API_REQUIRE_AUTH:-true}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-false}"
      AWS_S3_ENDPOINT_URL: http://minio:9000
    ports:
      # Host 7000 → container 8000
      - "${WEB_PORT:-7000}:8000"
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ========
  # Celery worker
  # ========
  celery-worker:
    <<: *app_image
    container_name: celery-worker
    restart: unless-stopped
    command: worker
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: redartdigital.settings.docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUTO_RELOAD: "false"
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ========
  # Celery beat (scheduler)
  # ========
  celery-beat:
    <<: *app_image
    container_name: celery-beat
    restart: unless-stopped
    command: beat
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: redartdigital.settings.docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUTO_RELOAD: "false"
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ========
  # Flower (Celery monitoring UI)
  # ========
  flower:
    <<: *app_image
    container_name: flower
    restart: unless-stopped
    command: flower
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: redartdigital.settings.docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FLOWER_PORT: "5555"
      FLOWER_BASIC_AUTH: "${FLOWER_BASIC_AUTH:-admin:changeme}"
    ports:
      # Host 7003 → container 5555
      - "${FLOWER_HOST_PORT:-7003}:5555"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

  # ========
  # MinIO (S3-compatible object storage)
  # ========
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      # Host 7004 → API 9000, Host 7005 → console 9001
      - "${MINIO_API_HOST_PORT:-7004}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-7005}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/$${AWS_STORAGE_BUCKET_NAME:-edi-files} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-edi-files}

# ========
# Volumes
# ========
volumes:
  postgres_data:
  media_data:
  static_data:
  minio_data:
