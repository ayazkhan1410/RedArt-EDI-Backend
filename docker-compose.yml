# ========
# RedArt EDI — Docker Compose
# One command: docker compose up --build
# ========

services:

  # ========
  # PostgreSQL
  # ========
  db:
    image: postgres:16-alpine
    container_name: redart_edi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edi}
      POSTGRES_USER: ${POSTGRES_USER:-edi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edi} -d ${POSTGRES_DB:-edi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========
  # Redis (Celery broker / results)
  # ========
  redis:
    image: redis:7-alpine
    container_name: redart_edi_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========
  # Django web (Gunicorn)
  # ========
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redart_edi_web
    restart: unless-stopped
    command: web
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: redartdigital.settings.docker
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ========
  # Celery worker
  # ========
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redart_edi_worker
    restart: unless-stopped
    command: worker
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: redartdigital.settings.docker
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  # ========
  # Celery beat (scheduler)
  # ========
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redart_edi_beat
    restart: unless-stopped
    command: beat
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: redartdigital.settings.docker
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

# ========
# Volumes
# ========
volumes:
  postgres_data:
  media_data:
  static_data:
